# CHARMS 训练优化配置文件
# 可以根据你的硬件配置调整这些参数

[training]
# 基本训练设置
total_timesteps = 500000
use_gpu = true
device = "cuda:0"

# 并行环境设置
use_parallel_envs = true
n_envs = 4  # 建议值: CPU核心数的一半

# 超参数优化
use_optimized_params = true

[environment]
# 环境优化参数
simulation_frequency = 20  # 提高仿真频率 (默认: 15)
episode_duration = 30      # 减少单episode时长 (默认: 40)
vehicles_count = 20        # 减少车辆数量 (默认: 50)
show_trajectories = false  # 关闭轨迹显示
real_time_rendering = false # 关闭实时渲染

[dqn_params]
# DQN超参数 (优化版本)
learning_rate = 0.0003
buffer_size = 100000
learning_starts = 5000
batch_size = 64
gamma = 0.995
train_freq = 4
gradient_steps = 2
target_update_interval = 1000
exploration_fraction = 0.15
exploration_final_eps = 0.02

# 网络架构
net_arch = [512, 512, 256]

[callbacks]
# 回调设置
checkpoint_freq = 50000
eval_freq = 25000
n_eval_episodes = 5
save_replay_buffer = false  # 设为false以节省时间和空间

[hardware_specific]
# 根据你的硬件调整
# 如果GPU内存不足，减少batch_size和buffer_size
# 如果CPU核心少，减少n_envs
# 如果训练太慢，减少vehicles_count和episode_duration

# 内存优化建议:
# - 低内存GPU (4GB): batch_size=32, buffer_size=50000
# - 中等内存GPU (8GB): batch_size=64, buffer_size=100000  
# - 高内存GPU (16GB+): batch_size=128, buffer_size=200000
